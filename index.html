<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Payday Planner</title>
<meta name="theme-color" content="#EEF1F6">
<meta name="description" content="Split each pay between the house transfer, bills account, savings and car money, and tick bills off as they go.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow column like a banking app — pay-month switcher, the split of this pay, then tabs for month / bills / owed & saving / car. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#F5F7FB; --ink:#141C2B; --muted:#5A6577; --line:#DAE0EA;
  --accent:#2343C4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --good:#1B7448; --good-soft:#DFF2E7; --warn:#9A5A00; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE3E1;
  --c-wife:#C2337A; --c-bills:#2F5BEA; --c-save:#0FA3B1; --c-car:#F08C00; --c-left:#2E9E4F;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#171F2B; --sunk:#121924; --ink:#E7ECF3; --muted:#97A2B4; --line:#2A3445;
  --accent:#8EA5FF; --accent-ink:#0E131B; --accent-soft:#1E2A4C;
  --good:#5CC28C; --good-soft:#163527; --warn:#E8AA45; --warn-soft:#3A2B12; --bad:#F08A80; --bad-soft:#3E1C1A;
  --c-wife:#F06AAE; --c-bills:#7C9BFF; --c-save:#3CD3E0; --c-car:#FFAE42; --c-left:#5CCB7E; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#171F2B; --sunk:#121924; --ink:#E7ECF3; --muted:#97A2B4; --line:#2A3445;
  --accent:#8EA5FF; --accent-ink:#0E131B; --accent-soft:#1E2A4C;
  --good:#5CC28C; --good-soft:#163527; --warn:#E8AA45; --warn-soft:#3A2B12; --bad:#F08A80; --bad-soft:#3E1C1A;
  --c-wife:#F06AAE; --c-bills:#7C9BFF; --c-save:#3CD3E0; --c-car:#FFAE42; --c-left:#5CCB7E; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
h2{font-size:1.15rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spread{justify-content:space-between}
#panel{display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.top .brand{flex:1;min-width:0}
.topwrap{display:flex;flex-direction:column;gap:2px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"£";position:absolute;inset:0;display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:.8rem}
.status{font-size:.8rem;color:var(--muted)}
.monthbar{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex-wrap:wrap}
.monthbar h1{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700}
.monthbar .nav{display:flex;gap:6px}
.payline{font-size:.85rem;color:var(--muted);margin-top:2px}
.payline b{color:var(--ink);font-weight:600}
.mover{display:flex;flex-direction:column;gap:4px}.mover .iconbtn{width:34px;height:28px;font-size:.9rem}.iconbtn:disabled{opacity:.3;cursor:default}
.gear{display:grid;place-items:center;color:var(--ink);flex:none}
.gear[aria-current="page"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--sunk)}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem}

/* example banner */
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner b{color:var(--warn)}

/* split */
.split-hero{display:flex;flex-direction:column;gap:6px}
.moneyin{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 10px;min-width:0}
.moneyin span{color:var(--muted);font-family:var(--f-num)}
.moneyin input{border:0;background:transparent;color:var(--ink);font-family:var(--f-num);font-size:1rem;width:6.5em;padding:8px 4px;min-width:0}
.moneyin.big input{font-size:1.6rem;width:6em}
.moneyin.big span{font-size:1.3rem}
.bar{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.bar>div{height:100%}
.leg{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.leg:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px}
.leg .what{min-width:0}
.leg .what b{display:block;font-weight:600}
.leg .what small{color:var(--muted)}
.leg.total{border-top:2px solid var(--ink)}
.leg.total b{font-family:var(--f-display);font-size:1.05rem}
.tick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 8px;font-size:.82rem;background:var(--surface);white-space:nowrap}
.tick .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.7rem;line-height:1}
.tick.on{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tick.on .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.neg{color:var(--bad)}
.extras{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.xrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0;font-size:.9rem;color:var(--muted)}
.xbtn{border:0;background:transparent;text-align:left;width:100%;color:var(--ink)}
.cameoff summary{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;list-style:none}
.cameoff summary::-webkit-details-marker{display:none}
.cameoff:not([open]){gap:0}
.splithead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;background:transparent;padding:0;text-align:left;width:100%}
.owedline{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.up{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.up:first-child{border-top:0}
.up .when{font-family:var(--f-num);font-size:.78rem;color:var(--muted)}
.balbox{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.balbox>div:first-child b{display:block}
.balbox>.btn{align-self:flex-start}
.balbox .kpi{background:var(--surface)}
.balgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.balgrid .kpi{padding:8px 10px;min-width:0}
.balgrid .kpi small{font-size:.62rem;letter-spacing:.04em;line-height:1.25;min-height:2.5em}
.balgrid .kpi .num{font-size:clamp(.88rem,4vw,1.05rem)!important}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.tabs button{flex:1 1 auto;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:.86rem;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

/* list */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 44px 1fr auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--muted);background:var(--surface);display:grid;place-items:center;font-size:.85rem;color:transparent;padding:0}
.check.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.check.part{border-color:var(--good);color:var(--good);font-family:var(--f-num);font-size:.72rem}
.day{font-family:var(--f-num);font-size:.7rem;color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0;background:var(--sunk);line-height:1.15;display:flex;flex-direction:column}
.day b{font-size:.92rem;color:var(--ink);font-weight:500}
.nmwrap{min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;background:transparent;padding:0}
.mid{min-width:0;display:flex;flex-direction:column;gap:6px}
.nm{font-weight:500;overflow-wrap:anywhere}
.notetxt{font-size:.82rem;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);letter-spacing:.02em}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.save{background:color-mix(in srgb,var(--c-save) 14%,transparent);color:var(--c-save);border-color:transparent}
.boxes{display:flex;gap:6px;flex-wrap:wrap}
.mini{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--muted);background:var(--surface);font-size:.75rem;font-family:var(--f-num);color:var(--muted);padding:0;display:grid;place-items:center}
.mini.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.amt{text-align:right}
.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:var(--good)}
.progress.save>div{background:var(--c-save)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.kpi .num{font-size:1.15rem}
.note{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 12px}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
.debt{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.debt:first-child{border-top:0}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
[hidden]{display:none!important}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:560px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:16px;border:1px solid var(--line);width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field .hint{font-size:.78rem;color:var(--muted)}
.confirm{background:var(--bad-soft);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
@media (max-width:440px){.leg{grid-template-columns:auto 1fr auto}.leg .tick{grid-column:2 / 4;justify-self:start}}
@media (prefers-reduced-motion:no-preference){.bar>div,.progress>div{transition:width .3s ease}}
.auth{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.auth .sheet{max-width:400px}
.auth .brand{font-size:1.3rem}
.authmsg{font-size:.85rem}
.authmsg.err{color:var(--bad)}
.authmsg.ok{color:var(--good)}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-weight:500;text-decoration:underline}
</style>
</head>
<body>

<div class="wrap">
  <div class="topwrap">
  <div class="top">
    <div class="brand"><i aria-hidden="true"></i>Payday Planner</div>
    <button class="iconbtn gear" id="settingsBtn" data-act="goto" data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="status" id="status">Loading your figures…</div>
  </div>
  <div class="monthbar">
    <div>
      <h1 id="monthTitle">—</h1>
      <div class="payline" id="payLine"></div>
    </div>
    <div class="nav">
      <button class="iconbtn" id="prevM" aria-label="Previous pay month">‹</button>
      <button class="iconbtn" id="todayM" aria-label="Current pay month" style="width:auto;padding:0 12px;font-size:.85rem">Now</button>
      <button class="iconbtn" id="nextM" aria-label="Next pay month">›</button>
    </div>
  </div>
  <div id="banner"></div>
  <section class="card" id="split"></section>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="month">This month</button>
    <button role="tab" data-tab="split">Pay split</button>
    <button role="tab" data-tab="bills">Bills</button>
    <button role="tab" data-tab="owed">Owed</button>
    <button role="tab" data-tab="car">Car</button>
  </nav>
  <div id="panel"></div>
</div>
<div id="sheetHost"></div>
<div class="auth" id="auth" hidden>
  <form class="sheet" id="authForm" novalidate onsubmit="return false">
    <div class="brand"><i aria-hidden="true"></i>Payday Planner</div>
    <h2 id="authTitle">Sign in</h2>
    <div class="small muted" id="authSub">Sign in to see your figures. They sync between your phone and computer.</div>
    <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" inputmode="email"></div>
    <div class="field" id="pwField"><label for="authPw">Password</label><input id="authPw" type="password" autocomplete="current-password"><span class="hint" id="pwHint" hidden>At least 6 characters.</span></div>
    <div class="authmsg" id="authMsg" role="alert"></div>
    <button type="button" class="btn primary" id="authGo">Sign in</button>
    <div class="row spread small"><button type="button" class="linkbtn" id="authSwitch">Create an account</button><button type="button" class="linkbtn" id="authForgot">Forgot password?</button></div>
  </form>
</div>

<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>

const mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const parseMk=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1)};
const addM=(k,n)=>{const d=parseMk(k);d.setMonth(d.getMonth()+n);return mk(d)};
const monthOnly=k=>parseMk(k).toLocaleDateString('en-GB',{month:'long',year:'numeric'});

const dshort=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

/* ---------- paydays ----------
   Normally the Thursday before the last Friday of the month.
   December: the Thursday before the last Friday before Christmas Day. */
function payday(k){
  const d=parseMk(k), y=d.getFullYear(), m=d.getMonth();
  const f=m===11?new Date(y,11,24):new Date(y,m+1,0);
  while(f.getDay()!==5) f.setDate(f.getDate()-1);
  f.setDate(f.getDate()-1); return f;
}
function currentPayK(){const t=today0();let k=mk(t);if(t<payday(k))k=addM(k,-1);return k}
const payName=k=>parseMk(k).toLocaleDateString('en-GB',{month:'long'})+' pay';
/* date a bill lands in this pay period: first matching day on or after payday */
function itemDate(k,day){
  const P=payday(k);
  for(let off=0;off<2;off++){
    const dim=new Date(P.getFullYear(),P.getMonth()+off+1,0).getDate();
    const c=new Date(P.getFullYear(),P.getMonth()+off,Math.min(day,dim));
    if(c>=P) return c;
  }
  return P;
}

let S=null, curK=currentPayK(), tab='month';
try{const t=localStorage.getItem('pp-tab');if(t&&t!=='settings')tab=t}catch(e){}

/* ---------- model ---------- */
function monthRec(k){
  const r=S.months[k]; if(r) return r;
  const prev=Object.keys(S.months).filter(x=>x<k).sort().at(-1);
  const p=prev?S.months[prev]:null;
  return{salary:p?p.salary:S.salaryDefault,wife:p?p.wife:S.wifeDefault,wifeSent:false,moved:false,paid:{},over:{},ticks:{},times:{},early:{},pend:{},oneOffs:[],adj:[],startBal:0,balance:null,car:null,carDone:false,_virtual:true};
}
function ensure(k){const r=monthRec(k); if(r._virtual){delete r._virtual;S.months[k]=r} return r}
const kindLabel=d=>d.kind==='Credit card'&&d.card?'Credit card · '+d.card:(d.kind||'Owed');
function timesFor(b,r){return r.times[b.id]!=null?+r.times[b.id]:(+b.times||1)}
function setAsideFor(b,r){return r.over[b.id]!=null?+r.over[b.id]:r2((+b.amount||0)*timesFor(b,r))}
function spentFor(b,r){
  const n=timesFor(b,r);
  if(n>1){const t=r.ticks[b.id]||[];let c=0;for(let i=0;i<n;i++)if(t[i])c++;return r2(c*setAsideFor(b,r)/n)}
  const v=r.paid[b.id]; return typeof v==='number'?v:0;
}
function carryIn(b,k){
  if(!b.carry||!b.carryFrom||b.carryFrom>=k) return 0;
  let t=0; for(let m=b.carryFrom;m<k;m=addM(m,1)){const r=monthRec(m);t+=setAsideFor(b,r)-spentFor(b,r)}
  return r2(t);
}
function paidTotal(id,beforeK){let t=0;for(const[k,r]of Object.entries(S.months)){if(beforeK&&k>=beforeK)continue;const v=r.paid&&r.paid[id];if(typeof v==='number')t+=v;const q=r.pend&&r.pend[id];if(typeof q==='number')t+=q}return r2(t)}
function pendingFor(id){return sum(Object.values(S.months),r=>r.pend&&typeof r.pend[id]==='number'?r.pend[id]:0)}
function debtLeft(d,beforeK){return Math.max(0,r2(d.balance-paidTotal(d.id,beforeK)))}
function paymentsDone(d,beforeK){return d.style==='split'&&d.monthly?Math.min(d.count,Math.round((d.total-debtLeft(d,beforeK))/d.monthly)):0}
function nextUnpaidK(d){
  let k=currentPayK(); if(d.from&&d.from>k) k=d.from;
  for(let i=0;i<120;i++,k=addM(k,1)){const r=monthRec(k);if(debtLeft(d,k)<=0.004)return null;if(r.paid[d.id]==null)return k}
  return null;
}
function earlyMonths(d){return Object.entries(S.months).filter(([k,r])=>r.early&&r.early[d.id]).map(([k])=>k).sort()}
function goalSaved(g,beforeK){return r2((+g.startSaved||0)+paidTotal(g.id,beforeK))}

function entriesFor(k){
  const r=monthRec(k), out=[];
  S.bills.forEach(b=>{
    const n=timesFor(b,r), day=+b.day||1;
    const ticks=n>1?Array.from({length:n},(_,i)=>!!(r.ticks[b.id]||[])[i]):null;
    out.push({id:b.id,name:b.name,note:b.note,kind:'Bill',type:'bill',amount:setAsideFor(b,r),spent:spentFor(b,r),carried:carryIn(b,k),
      carry:!!b.carry,times:n,usual:+b.times||1,ticks,done:n>1?ticks.every(Boolean):r.paid[b.id]!=null,date:(n>1||(+b.times||1)>1||b.noDate)?null:itemDate(k,day)});
  });
  S.debts.forEach(d=>{
    if(d.from&&d.from>k) return;
    const before=debtLeft(d,k), ph=r.paid[d.id], pd=r.pend[d.id]; if(before<=0.004&&ph==null&&pd==null) return;
    const flex=d.style==='flex';
    out.push({id:d.id,name:d.name,note:d.note,kind:kindLabel(d),type:'debt',flex,times:1,early:r.early[d.id]||null,
      payNo:d.style==='split'?paymentsDone(d,k)+1:null,payOf:d.count||null,
      amount:ph??pd??r.over[d.id]??Math.min(+d.monthly||0,before),spent:ph??0,left:before,done:ph!=null,pending:ph==null&&pd!=null,
      date:flex?null:itemDate(k,+d.day||1)});
  });
  (r.oneOffs||[]).forEach(o=>out.push({id:o.id,name:o.name,note:o.note,kind:'One-off',type:'oneoff',times:1,amount:+o.amount||0,
    spent:r.paid[o.id]??0,done:r.paid[o.id]!=null,date:itemDate(k,+o.day||1)}));
  const t=x=>x.date?x.date.getTime():9e15;
  const bills=out.filter(x=>x.type==='bill'), rest=out.filter(x=>x.type!=='bill').sort((a,b)=>t(a)-t(b)||a.name.localeCompare(b.name));
  return [...bills,...rest];
}
function goalsFor(k){
  const r=monthRec(k), out=[];
  S.goals.forEach(g=>{
    if(g.from&&g.from>k) return;
    const before=goalSaved(g,k), ph=r.paid[g.id], target=+g.target||0;
    const rem=target?Math.max(0,r2(target-before)):Infinity;
    if(target&&rem<=0.004&&ph==null) return;
    out.push({g,id:g.id,name:g.name,amount:ph??r.over[g.id]??Math.min(+g.monthly||0,rem),done:ph!=null,before,rem});
  });
  return out;
}
function potTotal(){let t=(+S.car.potStart||0)+sum(S.car.payments||[],x=>x.amount);for(const r of Object.values(S.months))if(r.carDone)t+=+r.car||0;return r2(t)}
function carStats(){
  const c=S.car; if(!c.start||!c.annualMiles||!c.termMonths) return null;
  const start=new Date(c.start+'T12:00:00'), end=new Date(start); end.setMonth(end.getMonth()+(+c.termMonths));
  const totalDays=(end-start)/864e5, totalAllowed=c.annualMiles*c.termMonths/12;
  const rs=[...c.readings].sort((a,b)=>a.date<b.date?-1:1), last=rs.at(-1);
  const allowedAt=iso=>Math.max(0,c.annualMiles*((new Date(iso+'T12:00:00')-start)/864e5)/365.25);
  const now=new Date();
  const monthsLeft=Math.max(0,(end.getFullYear()-now.getFullYear())*12+(end.getMonth()-now.getMonth()));
  const pot=potTotal(), ppm=(+c.ppm||0)/100;
  if(!last) return{start,end,totalAllowed,monthsLeft,pot,rs,allowedAt,ppm,noReading:true,suggest:0};
  const daysAt=Math.max(1,(new Date(last.date+'T12:00:00')-start)/864e5);
  const driven=last.miles-(+c.startOdo||0), allowed=allowedAt(last.date);
  const overNow=Math.max(0,driven-allowed), costNow=overNow*ppm;
  const projected=driven/daysAt*totalDays, projOver=Math.max(0,projected-totalAllowed), projCost=projOver*ppm;
  const suggest=monthsLeft>0?Math.max(0,Math.ceil((projCost-pot)/monthsLeft)):0;
  return{start,end,totalAllowed,monthsLeft,pot,rs,allowedAt,ppm,last,driven,allowed,overNow,costNow,projected,projOver,projCost,suggest,
    perMonth:driven/daysAt*30.44,allowPerMonth:c.annualMiles/12};
}
function carAmountFor(k){const r=monthRec(k);return r.car!=null?(+r.car||0):0}
function totals(k){
  const r=monthRec(k), items=entriesFor(k), goals=goalsFor(k);
  const inAcc=items.filter(i=>!i.early);
  const bills=sum(inAcc,i=>i.amount), spent=sum(inAcc,i=>i.spent), carried=sum(items,i=>i.carried||0);
  const carryOut=sum(items.filter(i=>i.carry),i=>i.carried+i.amount-i.spent);
  const savings=sum(goals,g=>g.amount), car=carAmountFor(k), salary=+r.salary||0, wife=+r.wife||0;
  return{r,items,goals,bills,spent,carried,carryOut,savings,car,salary,wife,
    start:+r.startBal||0, adj:sum(r.adj||[],a=>a.amount),
    left:r2((+r.startBal||0)+sum(r.adj||[],a=>a.amount)+salary-wife-bills-savings-car), inAccount:r2((r.moved?bills:0)+carried-spent),
    pending:r2((r.wifeSent?0:wife)+(r.moved?0:bills)+sum(goals.filter(g=>!g.done),g=>g.amount)+(r.carDone?0:car))};
}

/* ---------- persistence ---------- */
let docRef=null, saveT=null, saving=false, dirty=false, mode='loading', unsub=null, userEmail='';
function setStatus(t){$('#status').textContent=t}
function localSave(){try{const u=window.firebase&&firebase.apps&&firebase.apps.length&&firebase.auth().currentUser;localStorage.setItem('pp-state',JSON.stringify(u?{...S,_uid:u.uid}:S))}catch(e){}}
function localLoad(){try{const t=localStorage.getItem('pp-state');return t?JSON.parse(t):null}catch(e){return null}}
function save(){
  localSave(); dirty=true;
  if(mode!=='cloud'){setStatus(mode==='local'?'Saved in this browser only':'Saved');return}
  setStatus(navigator.onLine===false?'Offline – will sync when you’re back online':'Saving…'); clearTimeout(saveT); saveT=setTimeout(flush,600);
}
async function flush(){
  if(saving){saveT=setTimeout(flush,400);return}
  saving=true; dirty=false;
  try{await docRef.set({state:JSON.parse(JSON.stringify(S)),updatedAt:new Date().toISOString()});setStatus(dirty?'Saving…':'All changes saved')}
  catch(e){
    if(e&&e.code==='unavailable'){dirty=true;setTimeout(flush,800+Math.random()*800)}
    else if(e&&e.code==='permission-denied'){setStatus('Couldn’t save – check the database rules in Firebase')}
    else setStatus('Couldn’t save to your account – kept on this device');
  }finally{saving=false}
}
function normalise(s){
  s=JSON.parse(JSON.stringify(s||{})); delete s._uid;
  const b=blank(); s={...b,...s,car:{...b.car,...(s.car||{})}};
  s.goals=s.goals||[];
  s.bills.forEach(x=>{x.times=+x.times||1});
  s.debts.forEach(x=>{x.style=x.style||'fixed'});
  for(const r of Object.values(s.months)){r.paid=r.paid||{};r.over=r.over||{};r.ticks=r.ticks||{};r.times=r.times||{};r.early=r.early||{};r.pend=r.pend||{};r.oneOffs=r.oneOffs||[];r.adj=r.adj||[]}
  return s;
}
function startSync(user){
  const local=localLoad();
  userEmail=user.email||'';
  const fs=firebase.firestore();
  docRef=fs.collection('users').doc(user.uid).collection('data').doc('ledger');
  let first=true;
  const timer=setTimeout(()=>{if(first){mode='cloud';S=normalise(local&&local._uid===user.uid?local:blank());setStatus('Can’t reach your saved figures yet – showing this device’s copy');render()}},10000);
  unsub=docRef.onSnapshot({includeMetadataChanges:true},snap=>{
    if(snap.metadata.fromCache&&!first) return;
    if(first){
      if(snap.metadata.fromCache&&!snap.exists) return;
      first=false; clearTimeout(timer); mode='cloud';
      S=normalise(snap.exists?snap.data().state:blank());
      setStatus('All changes saved');
      render(); return;
    }
    if(snap.metadata.hasPendingWrites||dirty||saving||!snap.exists) return;
    const incoming=snap.data().state;
    if(JSON.stringify(incoming)!==JSON.stringify(S)){S=normalise(incoming);localSave();render();setStatus('Updated from another device')}
  },e=>{clearTimeout(timer);if(first){first=false;mode='local';S=normalise(local||blank());render()}
    setStatus(e&&e.code==='permission-denied'?'Can’t read your figures – check the database rules in Firebase':'Can’t reach your account – saving on this device only')});
}
function authUI(){
  let mode='in';
  const el=id=>document.getElementById(id);
  const msg=(t,ok)=>{el('authMsg').textContent=t;el('authMsg').className='authmsg '+(ok?'ok':'err')};
  const setMode=m=>{mode=m;
    el('authTitle').textContent=m==='in'?'Sign in':m==='up'?'Create your account':'Reset your password';
    el('authSub').textContent=m==='in'?'Sign in to see your figures. They sync between your phone and computer.':m==='up'?'Use the same email and password on your phone and computer.':'We’ll email you a link to set a new password.';
    el('authGo').textContent=m==='in'?'Sign in':m==='up'?'Create account':'Send reset email';
    el('pwField').hidden=m==='reset'; el('pwHint').hidden=m!=='up';
    el('authPw').autocomplete=m==='up'?'new-password':'current-password';
    el('authSwitch').textContent=m==='in'?'Create an account':'Back to sign in';
    el('authForgot').hidden=m!=='in'; msg('')};
  const nice={'auth/invalid-email':'That email address doesn’t look right.','auth/missing-password':'Enter your password.','auth/weak-password':'Use at least 6 characters for your password.',
    'auth/email-already-in-use':'There’s already an account with that email. Sign in instead.','auth/invalid-credential':'Email or password is wrong.','auth/wrong-password':'Email or password is wrong.',
    'auth/user-not-found':'No account with that email. Create one instead.','auth/too-many-requests':'Too many tries. Wait a few minutes and try again.','auth/network-request-failed':'No internet connection. Try again when you’re online.',
    'auth/operation-not-allowed':'Email sign-in isn’t turned on in Firebase yet.','auth/unauthorized-domain':'This web address isn’t on Firebase’s authorised domains list yet.'};
  const go=async()=>{
    const email=el('authEmail').value.trim(), pw=el('authPw').value, a=firebase.auth();
    el('authGo').disabled=true; msg('');
    try{
      if(mode==='in') await a.signInWithEmailAndPassword(email,pw);
      else if(mode==='up') await a.createUserWithEmailAndPassword(email,pw);
      else{await a.sendPasswordResetEmail(email);msg('Reset email sent. Check your inbox, then sign in.',true);setTimeout(()=>setMode('in'),50);el('authMsg').textContent='Reset email sent. Check your inbox, then sign in.';el('authMsg').className='authmsg ok'}
    }catch(e){msg(nice[e&&e.code]||('Something went wrong: '+(e&&e.message||e)))}
    finally{el('authGo').disabled=false}
  };
  el('authGo').onclick=go;
  el('authForm').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  el('authSwitch').onclick=()=>setMode(mode==='in'?'up':'in');
  el('authForgot').onclick=()=>setMode('reset');
}
function boot(){
  render();
  if(!window.firebase||!FIREBASE_CONFIG){
    mode='local'; S=normalise(localLoad()||example());
    setStatus(FIREBASE_CONFIG?'Couldn’t load sync – saving on this device only':'Not connected to sync yet – saving on this device only');
    render(); return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{});
  authUI();
  firebase.auth().onAuthStateChanged(user=>{
    if(unsub){unsub();unsub=null}
    if(user){document.getElementById('auth').hidden=true;S=null;mode='loading';setStatus('Loading your figures…');render();startSync(user)}
    else{S=null;docRef=null;mode='loading';setStatus('');render();document.getElementById('auth').hidden=false}
  });
  addEventListener('online',()=>{if(dirty&&mode==='cloud')flush()});
}
function signOut(){
  try{localStorage.removeItem('pp-state')}catch(e){}
  firebase.auth().signOut();
}

function applyTheme(v){
  const root=document.documentElement;
  if(v==='light'||v==='dark') root.setAttribute('data-theme',v); else root.removeAttribute('data-theme');
  const dark=v==='dark'||(v!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=dark?'#0E131B':'#EEF1F6';
}

function countdown(from,to){
  const a=new Date(from.getFullYear(),from.getMonth(),from.getDate()), b=new Date(to.getFullYear(),to.getMonth(),to.getDate());
  const d=Math.round((b-a)/864e5); if(d<=0) return 'Today';
  const w=Math.floor(d/7), r=d%7; return (w?w+'w':'')+(w&&r?' ':'')+(r?r+'d':'');
}

function upcoming(t){
  const rem=i=>i.carry?Math.max(0,r2(i.carried+i.amount-i.spent)):i.times>1?Math.max(0,r2(i.amount-i.spent)):(+i.amount||0);
  const list=t.items.filter(i=>!i.done&&!i.early).map(i=>({...i,rem:rem(i)})).filter(i=>i.rem>0.004);
  const tm=x=>x.date?x.date.getTime():9e15;
  list.sort((a,b)=>tm(a)-tm(b));
  return{list,total:sum(list,i=>i.rem)};
}

function dueChip(i){
  if(i.times>1) return '';

  if(i.done) return '<span class="chip good">Gone out</span>';
  if(i.carry) return '<span class="chip">Carries over if not used</span>';
  if(!i.date) return '';
  const diff=Math.round((i.date-today0())/864e5);
  if(diff<0) return '<span class="chip bad">Was due '+i.date.getDate()+' '+i.date.toLocaleDateString('en-GB',{month:'short'})+' – not ticked</span>';
  if(diff<=3) return '<span class="chip warn">'+(diff===0?'Due today':'Due in '+diff+(diff===1?' day':' days'))+'</span>';
  return '';
}

function sheet({title,fields,values={},onSave,onDelete,onClear,clearLabel,note,validate}){
  const host=$('#sheetHost');
  const optHtml=(f)=>f.options.map(o=>{const v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:o;return`<option value="${esc(v)}" ${v===values[f.key]?'selected':''}>${esc(l)}</option>`}).join('');
  host.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <h2>${esc(title)}</h2>${note?`<div class="small muted">${esc(note)}</div>`:''}
    <div class="small" id="formErr" role="alert" style="color:var(--bad);font-weight:600"></div>
    ${fields.map(f=>`<div class="field" data-fk="${f.key}"><label for="f_${f.key}">${esc(f.label)}</label>${
      f.type==='select'?`<select id="f_${f.key}">${optHtml(f)}</select>`
      :`<input id="f_${f.key}" ${f.type==='date'?'type="date"':(f.type==='text'?'type="text"':'inputmode="decimal"')} value="${esc(values[f.key]??'')}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`}
      ${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`).join('')}
    <div id="delArea"></div>
    <div class="row spread">${onDelete?'<button type="button" class="btn danger" id="delBtn">Delete</button>':(onClear?`<button type="button" class="btn danger" id="clrBtn">${esc(clearLabel||'Clear')}</button>`:'<span></span>')}
      <div class="row"><button type="button" class="btn" id="cancelBtn">Cancel</button><button type="button" class="btn primary" id="saveBtn">Save</button></div></div>
  </div></div>`;
  const close=()=>{host.innerHTML=''};
  const vis=()=>fields.forEach(f=>{if(!f.showIf)return;const c=$('#f_'+f.showIf.key).value;host.querySelector(`[data-fk="${f.key}"]`).hidden=f.showIf.test?!f.showIf.test(c,k=>{const el=$('#f_'+k);return el?el.value:''}):!f.showIf.in.includes(c)});
  host.addEventListener('change',vis); host.addEventListener('input',vis); vis();
  host.querySelector('.scrim').addEventListener('click',e=>{if(e.target.classList.contains('scrim'))close()});
  $('#cancelBtn').onclick=close;
  if(onClear&&!onDelete) $('#clrBtn').onclick=()=>{onClear();close();save();render()};
  if(onDelete) $('#delBtn').onclick=()=>{$('#delArea').innerHTML=`<div class="confirm"><span>Delete this for good?</span><span class="row"><button type="button" class="btn" id="noDel">Keep</button><button type="button" class="btn danger" id="yesDel">Delete</button></span></div>`;
    $('#noDel').onclick=()=>$('#delArea').innerHTML='';$('#yesDel').onclick=()=>{onDelete();close();save();render()}};
  const showErr=m=>{const el=$('#formErr');el.textContent=m;el.scrollIntoView({block:'nearest'})};
  const submit=()=>{ const out={};
    for(const f of fields){
      if(host.querySelector(`[data-fk="${f.key}"]`).hidden){out[f.key]=f.type==='text'?'':null;continue}
      let v=$('#f_'+f.key).value.trim();
      if(f.type==='money'||f.type==='number'||f.type==='day'||f.type==='signed'){
        if(v===''&&f.optional){out[f.key]=null;continue}
        const n=parseFloat(v.replace(/[£,\s]/g,''));
        if(isNaN(n)||(n<0&&f.type!=='signed')){showErr(f.label+' needs a number.');return}
        if(f.type==='day'&&(n<1||n>31)){showErr('Day must be between 1 and 31.');return}
        out[f.key]=f.type==='day'?Math.round(n):r2(n);
      }else{if(!v&&(f.required||f.type==='date')){showErr(f.label+' can’t be empty.');return}out[f.key]=v}
    }
    const err=validate&&validate(out); if(err){showErr(err);return}
    try{onSave(out)}catch(ex){showErr('Couldn’t save that: '+(ex&&ex.message||ex));return}
    close(); save(); render();
  };
  $('#saveBtn').onclick=submit;
  host.querySelector('.sheet').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();submit()}});
  const firstIn=host.querySelector('input,select'); if(firstIn) firstIn.focus();
}

function applyDebt(d,v){

      if(multi||r.times[id]!=null) fields.push({key:'times',label:'How many this month',type:'number',optional:true,hint:'Blank uses the usual '+bl.times+'. Handy for months with 5 weeks.'});
      if(it.carry&&r.paid[id]!=null) fields.push({key:'spent',label:'Spent this month (£)',type:'money',optional:true});
      sheet({title:it.name,note:'Changes here only affect '+payName(curK)+'.',fields,values:{amount:r.over[id]??'',times:r.times[id]??'',spent:r.paid[id]??''},
        onSave:v=>{const rr=ensure(curK);
          if(v.times==null)delete rr.times[id];else rr.times[id]=Math.max(1,Math.round(v.times));
          if(v.amount==null)delete rr.over[id];else rr.over[id]=v.amount;
          if('spent' in v){if(v.spent==null)delete rr.paid[id];else rr.paid[id]=v.spent}
          else if(rr.paid[id]!=null&&!bl.carry)rr.paid[id]=setAsideFor(bl,rr)}});
      return}
    const d=S.debts.find(x=>x.id===id);
    const fields=[{key:'amount',label:'Plan for this month (£)',type:'money',optional:true}];
    if(r.paid[id]!=null) fields.push({key:'paid',label:'Actually paid (£)',type:'money',optional:true});
    sheet({title:it.name,note:'Changes here only affect '+payName(curK)+'.',fields,values:{amount:r.over[id]??'',paid:r.paid[id]??''},
      onSave:v=>{const rr=ensure(curK);if(v.amount==null)delete rr.over[id];else rr.over[id]=v.amount;
        if('paid' in v){if(v.paid==null)delete rr.paid[id];else rr.paid[id]=v.paid}}});
    return}
  case 'move-bill':{const i=S.bills.findIndex(x=>x.id===id),j=i+(+b.dataset.dir);if(i<0||j<0||j>=S.bills.length)return;const a=S.bills;[a[i],a[j]]=[a[j],a[i]];break}
  case 'sort-bills':{const dk=x=>(x.times||1)>1||x.noDate?99:(+x.day||1);S.bills.sort((a,b)=>dk(a)-dk(b));break}
  case 'add-adj': sheet({title:'Money in or out',note:'Added to '+payName(curK)+' alongside your salary.',fields:[{key:'label',label:'What it is',type:'text',ph:'e.g. Sold old phone'},{key:'dir',label:'Money in or out',type:'select',options:[{v:'in',l:'Money in (adds to what you have)'},{v:'out',l:'Money out (takes away)'}]},{key:'amount',label:'Amount (£)',type:'money'}],values:{dir:'in'},
    onSave:v=>ensure(curK).adj.push({id:newId(),label:v.label,amount:v.dir==='out'?-v.amount:v.amount})}); return;
  case 'edit-adj':{const r=ensure(curK),a=r.adj.find(x=>x.id===id);if(!a)return;
    sheet({title:'Money in or out',fields:[{key:'label',label:'What it is',type:'text',ph:'e.g. Sold old phone'},{key:'dir',label:'Money in or out',type:'select',options:[{v:'in',l:'Money in (adds to what you have)'},{v:'out',l:'Money out (takes away)'}]},{key:'amount',label:'Amount (£)',type:'money'}],values:{label:a.label,dir:a.amount<0?'out':'in',amount:Math.abs(a.amount)},
    onSave:v=>Object.assign(a,{label:v.label,amount:v.dir==='out'?-v.amount:v.amount}),onDelete:()=>{r.adj=r.adj.filter(x=>x.id!==id)}});return}
  case 'set-balance':{const r=monthRec(curK);
    sheet({title:'Main account balance',note:(r.balance?'Last balance '+fmt(r.balance.amount)+' on '+nice(r.balance.date)+'. ':'')+'What your banking app says right now. Use a minus sign if you’re overdrawn. Anything you haven’t ticked as moved out yet (house transfer, bills account, savings, car) is taken off to work out what’s left to spend.',
    fields:[{key:'amount',label:'Balance (£)',type:'signed'},{key:'date',label:'Date',type:'date'}],values:{amount:'',date:isoToday()},
    onSave:v=>{ensure(curK).balance={amount:v.amount,date:v.date}},onClear:r.balance?()=>{ensure(curK).balance=null}:null,clearLabel:'Remove balance'});return}
  case 'add-bill': sheet({title:'Add a bill',fields:billFields,values:{day:1,times:1,carry:'no',when:'day'},
      onSave:v=>S.bills.push({id:newId(),name:v.name,note:v.note,amount:v.amount,day:v.day||1,noDate:v.when==='any',times:Math.max(1,Math.round(v.times||1)),carry:v.carry==='yes',carryFrom:v.carry==='yes'?curK:null})}); return;
  case 'edit-bill':{const bl=S.bills.find(x=>x.id===id);
    sheet({title:'Edit bill',fields:billFields,values:{...bl,carry:bl.carry?'yes':'no',when:bl.noDate?'any':'day'},
      onSave:v=>{const was=!!bl.carry;Object.assign(bl,{name:v.name,note:v.note,amount:v.amount,day:v.day||bl.day||1,noDate:v.when==='any',times:Math.max(1,Math.round(v.times||1)),carry:v.carry==='yes'});if(bl.carry&&!was)bl.carryFrom=curK},
      onDelete:()=>{S.bills=S.bills.filter(x=>x.id!==id)}});return}
  case 'add-debt': sheet({title:'Add something you owe',fields:debtFields,values:{kind:'Klarna',style:'split',count:3,doneN:1,day:1},validate:debtValidate,
      onSave:v=>{const d={id:newId(),from:curK};applyDebt(d,v);S.debts.push(d)}}); return;
  case 'edit-debt':{const d=S.debts.find(x=>x.id===id);
    sheet({title:'Edit',fields:debtFields,values:{...d,left:debtLeft(d),monthly:d.monthly||'',doneN:paymentsDone(d)},note:'Changing the balance keeps your recorded payments.',validate:debtValidate,
      onSave:v=>applyDebt(d,v),onDelete:()=>{S.debts=S.debts.filter(x=>x.id!==id)}});return}
  case 'pay-early':{const d=S.debts.find(x=>x.id===id);const k=nextUnpaidK(d);if(!k)return;
    const amt=Math.min(d.monthly,debtLeft(d,k));
    sheet({title:'Paid early – '+d.name,note:`This marks your ${payName(k)} ${k.slice(0,4)} payment as paid, and takes it out of the bills account total for that month.`,
      fields:[{key:'amount',label:'Amount paid (£)',type:'money'},{key:'date',label:'Date paid',type:'date'}],values:{amount:amt,date:isoToday()},
      onSave:v=>{const r=ensure(k);r.paid[id]=v.amount;r.early[id]=v.date}});return}
  case 'add-payment':{const d=S.debts.find(x=>x.id===id);
    sheet({title:'Payment to '+d.name,note:'Added to '+payName(currentPayK())+'.',fields:[{key:'amount',label:'Amount paid (£)',type:'money'}],onSave:v=>addToPay(id,v.amount)});return}
  case 'add-goal': sheet({title:'Something to save for',fields:goalFields,onSave:v=>S.goals.push({id:newId(),name:v.name,note:v.note,target:v.target||0,startSaved:v.startSaved||0,where:v.where,monthly:v.monthly||0,from:curK})}); return;
  case 'edit-goal':{const g=S.goals.find(x=>x.id===id);
    sheet({title:'Edit savings',fields:goalFields,values:{...g,target:g.target||'',monthly:g.monthly||''},
      onSave:v=>Object.assign(g,{name:v.name,note:v.note,target:v.target||0,startSaved:v.startSaved||0,where:v.where,monthly:v.monthly||0}),
      onDelete:()=>{S.goals=S.goals.filter(x=>x.id!==id)}});return}
  case 'add-saving':{const g=S.goals.find(x=>x.id===id);
    sheet({title:'Add to '+g.name,note:(g.where?'Kept in '+g.where+'. ':'')+'Added to '+payName(currentPayK())+'.',fields:[{key:'amount',label:'Amount (£)',type:'money'}],onSave:v=>addToPay(id,v.amount)});return}
  case 'edit-lease': sheet({title:'Lease details',values:S.car,fields:[
      {key:'start',label:'Lease start date',type:'date'},{key:'termMonths',label:'Length (months)',type:'number'},
      {key:'annualMiles',label:'Miles allowed per year',type:'number'},{key:'ppm',label:'Excess charge (pence per mile)',type:'number',hint:'Check your lease agreement, e.g. 7.5'},
      {key:'startOdo',label:'Odometer when you got the car',type:'number'},{key:'potStart',label:'Already put aside before using this (£)',type:'money'},
      {key:'potWhere',label:'Where the mileage money is kept',type:'text',ph:'e.g. Chase saver'}],
    onSave:v=>Object.assign(S.car,v)}); return;
  case 'add-car-money': sheet({title:'Money put aside for miles',note:S.car.potWhere?'Kept in '+S.car.potWhere:'',fields:[{key:'date',label:'Date',type:'date'},{key:'amount',label:'Amount (£)',type:'money'}],values:{date:isoToday()},
    onSave:v=>{S.car.payments=S.car.payments||[];S.car.payments.push({id:newId(),...v})}}); return;
  case 'edit-car-money':{const x=(S.car.payments||[]).find(y=>y.id===id);if(!x)return;
    sheet({title:'Money put aside',fields:[{key:'date',label:'Date',type:'date'},{key:'amount',label:'Amount (£)',type:'money'}],values:x,
    onSave:v=>Object.assign(x,v),onDelete:()=>{S.car.payments=S.car.payments.filter(y=>y.id!==id)}});return}
  case 'add-reading': sheet({title:'Odometer reading',fields:[{key:'date',label:'Date',type:'date'},{key:'miles',label:'Miles on the clock',type:'number'}],values:{date:isoToday()},
    onSave:v=>S.car.readings.push({id:newId(),...v})}); return;
  case 'edit-reading':{const rd=S.car.readings.find(x=>x.id===id);sheet({title:'Edit reading',fields:[{key:'date',label:'Date',type:'date'},{key:'miles',label:'Miles on the clock',type:'number'}],values:rd,
    onSave:v=>Object.assign(rd,v),onDelete:()=>{S.car.readings=S.car.readings.filter(x=>x.id!==id)}});return}
  default: return;
  }
  save(); render();
});
$('#prevM').onclick=()=>{curK=addM(curK,-1);render()};
$('#nextM').onclick=()=>{curK=addM(curK,1);render()};
$('#todayM').onclick=()=>{curK=currentPayK();render()};

render(); boot();
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
